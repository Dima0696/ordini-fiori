# Pinning della versione Node per Railway/Nixpacks.
# Node 20 LTS ha prebuilt per better-sqlite3 ed ha già globalThis.crypto
# nativamente (per @simplewebauthn/server v13).
# Python è aggiunto come safety net nel caso better-sqlite3 dovesse
# comunque compilare da source via node-gyp.
[phases.setup]
nixPkgs = ['nodejs_20', 'python3', 'gcc', 'gnumake']

[phases.install]
cmds = ['npm install --no-audit']
